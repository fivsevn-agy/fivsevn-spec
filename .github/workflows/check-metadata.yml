name: Check shared metadata
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyyaml jsonschema
      - run: python -m unittest discover -s tests -p 'test_metadata_schema.py' -v
      - run: python tools/check_metadata.py --repo spec --schema content/content-metadata.schema.json
