name: Check shared metadata
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0 referencing==0.37.0
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tools/check_metadata.py --repo spec --schema content/content-metadata.schema.json
