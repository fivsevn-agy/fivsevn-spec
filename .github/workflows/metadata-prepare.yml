name: Prepare reviewed metadata changes
on:
  push:
    branches: [maintenance/metadata-unify-20261013]
    paths: [.github/workflows/metadata-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/maintenance/metadata-unify-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: maintenance/metadata-unify-20261013
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyyaml jsonschema
      - name: Read pinned migration and normalize documentation
        run: |
          curl --fail --location --retry 2 https://raw.githubusercontent.com/fivsevn-agy/fivsevn-devlog/0ab6cb272e1f8b42ca17f47b81037423aaf5b8f0/_maintenance_metadata.py -o /tmp/metadata-migrate.py
          python /tmp/metadata-migrate.py --repo spec --root .
      - name: Validate shared schema and documents
        run: |
          python -m unittest discover -s tests -p 'test_metadata_schema.py' -v
          python tools/check_metadata.py --repo spec --schema content/content-metadata.schema.json --json /tmp/metadata-check.json
          git -c core.whitespace=-blank-at-eol diff --check
      - name: Save review evidence
        uses: actions/upload-artifact@v4
        with:
          name: spec-metadata-review
          path: |
            /tmp/metadata-result.json
            /tmp/metadata-check.json
          retention-days: 30
      - name: Commit only to maintenance branch
        run: |
          test "$(git branch --show-current)" = maintenance/metadata-unify-20261013
          git rm .github/workflows/metadata-prepare.yml
          git add -A
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: Unify document metadata while retaining special information'
          git push origin HEAD:refs/heads/maintenance/metadata-unify-20261013
